<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Selamat Ulang Tahun Sayangku</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
      animation: fadeIn 2s ease;
    }
    h1 {
      color: #ff4d6d;
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    p {
      color: #444;
      font-size: 1.2em;
    }
    .heart {
      color: red;
      font-size: 2em;
      animation: pulse 1.2s infinite;
    }
    .cake {
      margin-top: 20px;
      font-size: 80px;
      animation: bounce 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: fall 5s linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 Selamat Ulang Tahun Sayangku 🎂</h1>
    <p>Semoga panjang umur, sehat selalu,<br>dan makin bahagia bersama aku ❤️</p>
    <div class="heart">💖</div>
    <div class="cake">🎂</div>
  </div>

  <!-- Musik romantis -->
  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    Browser kamu tidak mendukung audio.
  </audio>

  <script>
    // Confetti effect
    for(let i=0; i<50; i++) {
      let confetti = document.createElement("div");
      confetti.classList.add("confetti");
      confetti.style.left = Math.random() * window.innerWidth + "px";
      confetti.style.backgroundColor = ["#ff4d6d","#ffd700","#4dd2ff","#a64dff"][Math.floor(Math.random()*4)];
      confetti.style.animationDuration = (Math.random()*3+2) + "s";
      document.body.appendChild(confetti);
    }
  </script>
</body>
</html>
